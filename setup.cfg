[metadata]
name = scinexusrag
version = attr: scinexusrag.__version__
description = Local document search and cited answers with retrieval and evidence benchmarks
long_description = file: README.md
long_description_content_type = text/markdown
license_expression = MIT
license_files = LICENSE
author = urme
keywords =
    rag
    llm
    scientific-literature
    retrieval-augmented-generation
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence
project_urls =
    Homepage = https://github.com/urmeo/nexus-rag
    Repository = https://github.com/urmeo/nexus-rag

[options]
packages = find_namespace:
package_dir =
    = src
include_package_data = True
python_requires = >=3.11.4
setup_requires = setuptools>=77
install_requires =
    numpy>=1.26.0
    fastapi>=0.115.0
    uvicorn[standard]>=0.32.0
    pydantic>=2.10.0
    pydantic-settings>=2.6.0
    sentence-transformers>=3.3.0
    torch>=2.13.0
    httpx>=0.28.0
    lancedb>=0.17.0
    pyarrow>=18.0.0
    pypdf>=5.1.0
    python-docx>=1.1.2
    python-multipart>=0.0.18
    python-dotenv>=1.0.1
    rank-bm25>=0.2.2
    slowapi>=0.1.9
    python-magic>=0.4.27

[options.packages.find]
where = src

[options.package_data]
scinexusrag =
    py.typed
    web/*.html
    web/css/*.css
    web/js/*.js
    web/images/*.svg
scinexusrag.eval =
    data/*.json
    data/*/*.jsonl

[options.extras_require]
dev =
    pytest>=8.3.0
    pytest-asyncio>=0.25.0
    pytest-cov>=6.0.0
    ruff==0.15.17
    mypy>=1.13.0
    PyYAML>=6.0.2
eval =
    datasets>=3.0.0
    matplotlib>=3.8.0
    scipy>=1.11.0

[options.entry_points]
console_scripts =
    scinexusrag = scinexusrag.cli:main
    scinexusrag-eval = scinexusrag.eval.run:main
    scinexusrag-report = scinexusrag.eval.report:main

[tool:pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --tb=short

[mypy]
strict = True
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = True
plugins = pydantic.mypy

[mypy-lancedb.*,sentence_transformers.*,pyarrow,pyarrow.*,rank_bm25,rank_bm25.*,datasets,datasets.*,matplotlib,matplotlib.*,transformers,transformers.*,scipy,scipy.*,slowapi,slowapi.*,magic]
ignore_missing_imports = True

[coverage:run]
source = src/scinexusrag
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if TYPE_CHECKING:
