services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.5.1}
    expose:
      - "11434"
    environment:
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD-SHELL
        - test -f "$${TMPDIR:-/tmp}/nexusrag-ollama-ready" && ollama list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ready_file="$${TMPDIR:-/tmp}/nexusrag-ollama-ready"
        server_pid=
        pull_pid=
        cleanup() {
          rm -f "$$ready_file"
          for pid in "$$pull_pid" "$$server_pid"; do
            if [ -n "$$pid" ]; then kill "$$pid" 2>/dev/null || true; fi
          done
          for pid in "$$pull_pid" "$$server_pid"; do
            if [ -n "$$pid" ]; then wait "$$pid" 2>/dev/null || true; fi
          done
        }
        trap cleanup EXIT
        trap 'exit 0' TERM INT
        rm -f "$$ready_file"
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do
          if ! kill -0 "$$server_pid" 2>/dev/null; then
            wait "$$server_pid"
            exit 1
          fi
          sleep 1
        done
        ollama pull "$$LLM_MODEL" &
        pull_pid=$$!
        while kill -0 "$$pull_pid" 2>/dev/null; do
          if ! kill -0 "$$server_pid" 2>/dev/null; then
            wait "$$server_pid"
            exit 1
          fi
          sleep 1
        done
        wait "$$pull_pid"
        pull_pid=
        if ! kill -0 "$$server_pid" 2>/dev/null; then
          wait "$$server_pid"
          exit 1
        fi
        touch "$$ready_file"
        wait "$$server_pid"
        exit 1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - NEXUSRAG_API_KEY=${NEXUSRAG_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g

volumes:
  ollama_data:
