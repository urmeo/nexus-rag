<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1208" viewBox="0 0 1280 1208" role="img" aria-labelledby="answer-checks-title answer-checks-description">
  <title id="answer-checks-title">How NexusRAG builds and checks an answer</title>
  <desc id="answer-checks-description">Build at most five numbered source passages after deduplicating passage IDs. The formatted source context is capped at six thousand characters. When clipped, a truncation marker is appended; the whole prompt is not capped at this limit. Ollama generates with llama3.2:3b. Errors or blank output return sources, zero confidence and a warning, bypassing answer checks. Successful output has invalid citation indices removed and warnings added. With NLI disabled by default, confidence equally weights mean normalized source scores and distinct cited-source coverage. With NLI enabled, every sentence is compared with every source; best entailment of at least 0.5 counts as grounded, and confidence is the fraction grounded. NLI does not rewrite or regenerate the answer. The API returns answer, source excerpts, confidence, warnings and processing time. Valid citation indices and confidence scores do not establish correctness.</desc>
  <defs>
    <style>text { font-family: Inter, Arial, sans-serif; } .mono { font-family: "IBM Plex Mono", "Courier New", monospace; }</style>
  </defs>
  <rect width="1280" height="1208" fill="#121A20"/>
