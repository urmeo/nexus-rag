<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="72" y="243.273">Deduplicate passage IDs&#10;</tspan><tspan x="72" y="271.273">&#x2264;5 numbered sources&#10;</tspan><tspan x="72" y="299.273">Source context clipped&#10;</tspan><tspan x="72" y="327.273">at 6,000 characters</tspan></text>
<rect x="432" y="156" width="320" height="192" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="456" y="199.727">Generate answer</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="IBM Plex Mono, Courier New, monospace" font-size="19" letter-spacing="0em"><tspan x="456" y="242.625">Ollama &#xb7; llama3.2:3b</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="456" y="279.273">Numbered-source prompt&#10;</tspan><tspan x="456" y="307.273">Question-format hint</tspan></text>
