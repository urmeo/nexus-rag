<svg role="img" aria-labelledby="diagram-title diagram-description" width="1280" height="1120" viewBox="0 0 1280 1120" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="diagram-title">NexusRAG answer checks: sources, confidence and response</title>
<desc id="diagram-description">The standard query API deduplicates passage IDs, keeps up to five numbered sources and clips formatted source context at 6000 characters before a truncation marker. Local Ollama defaults to llama3.2:3b. Generation errors or empty output retain sources, return zero confidence and a warning, and skip answer checks. Successful answers have out-of-range citation indices removed and missing or invalid citations flagged. NLI is off by default: heuristic confidence gives equal weight to mean normalized source score and distinct-source citation coverage. With NLI enabled, compare every answer sentence with every source; best entailment of at least 0.5 counts as grounded. Confidence becomes the fraction grounded, with support warnings. Return the answer, source excerpts, confidence, warnings and processing time. NLI does not rewrite or regenerate the answer, and citation indices do not prove factual support.</desc>
<rect width="1280" height="1120" fill="#14191C"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="0em"><tspan x="48" y="66.1364">ANSWER CHECKS</tspan></text>
