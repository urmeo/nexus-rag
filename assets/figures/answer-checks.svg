  <path data-name="NLI result" d="M1048 884 L1048 916 L840 916" fill="none" stroke="#F59A87" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7"/>
  <path data-name="Selected confidence to response" d="M840 916 L840 940" fill="none" stroke="#62D5ED" stroke-width="2.5" stroke-linejoin="round"/>
