  <text data-name="Citation index checks detail 1" x="880" y="232" font-size="25" font-weight="400" fill="#B7C9D2">Remove out-of-range [n]</text>
  <text data-name="Citation index checks detail 2" x="880" y="266" font-size="25" font-weight="400" fill="#B7C9D2">Warn if invalid or missing</text>
