  <path data-name="Optional NLI path" d="M1040 554 L1040 652" fill="none" stroke="#F59A87" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 7"/>
  <polygon points="1040,652 1034,640 1046,640" fill="#F59A87"/>
  <text data-name="Enabled label" x="1056" y="608" font-size="24" font-weight="400" fill="#F59A87" class="mono">on</text>
