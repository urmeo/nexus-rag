  <polygon points="444,264 432,258 432,270" fill="#62D5ED"/>
  <path data-name="Generated text to citations" d="M794 264 L844 264" fill="none" stroke="#62D5ED" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="844,264 832,258 832,270" fill="#62D5ED"/>
