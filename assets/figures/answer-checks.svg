  <text data-name="Numbered sources detail 1" x="80" y="232" font-size="25" font-weight="400" fill="#B7C9D2">Deduplicate passage IDs</text>
  <text data-name="Numbered sources detail 2" x="80" y="266" font-size="25" font-weight="400" fill="#B7C9D2">≤5 numbered passages</text>
  <text data-name="Numbered sources detail 3" x="80" y="300" font-size="25" font-weight="400" fill="#B7C9D2">Source context:</text>
  <text data-name="Numbered sources detail 4" x="80" y="334" font-size="25" font-weight="400" fill="#B7C9D2">≤6,000 chars + marker</text>
  <rect id="answer-checks-shape-8" data-name="Ollama generation" x="456" y="152" width="336" height="224" rx="10" fill="#1B2831" stroke="#546B78" stroke-width="2"/>
