  <text data-name="Ollama generation detail 2" x="480" y="266" font-size="25" font-weight="400" fill="#B7C9D2">Numbered-source prompt</text>
  <text data-name="Ollama generation detail 3" x="480" y="300" font-size="25" font-weight="400" fill="#B7C9D2">Question-format hint</text>
