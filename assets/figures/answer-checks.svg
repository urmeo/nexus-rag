<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="880" y="735.273">Every sentence &#xd7; all sources&#10;</tspan><tspan x="880" y="763.273">Best entailment &#x2265;0.5&#10;</tspan><tspan x="880" y="791.273">Confidence: fraction grounded</tspan></text>
