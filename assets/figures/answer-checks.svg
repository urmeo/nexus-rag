<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="840" y="243.273">Keep [1]&#x2026;[N]&#10;</tspan><tspan x="840" y="271.273">Remove out-of-range indices&#10;</tspan><tspan x="840" y="299.273">Warn on invalid or missing citations</tspan></text>
