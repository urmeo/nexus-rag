<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950" role="img" aria-labelledby="title description">
  <title id="title">From passages to response</title>
  <desc id="description">The standard query API builds at most five numbered sources, clips formatted source context at 6000 characters, and calls Ollama once. It removes out-of-range citation indices. If NLI is enabled, it checks each answer sentence against every source and uses the best entailment to report the fraction grounded and warnings. Otherwise it computes a retrieval and citation-coverage heuristic. It returns an answer, source excerpts, confidence, timing and warnings. NLI does not rewrite the answer or trigger generation.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; fill: #172b45; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52647a; }
      .lane { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; fill: #52647a; }
      .heading { font-size: 23px; font-weight: 700; }
      .detail { font-size: 18px; fill: #42566e; }
      .edge-label { font-size: 17px; fill: #52647a; }
      .flow { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
      .feedback-flow { fill: none; stroke: #ae691a; stroke-width: 2; stroke-linejoin: round; }
      .index-flow { fill: none; stroke: #2465ad; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1120" height="950" rx="18" fill="#fff"/>
  <text class="title" x="40" y="52">From passages to response</text>
  <text class="subtitle" x="40" y="84">Standard POST /api/query path · answer checks finish before the response is returned.</text>
  <g><rect x="40" y="144" width="296" height="132" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="58" y="180">Build sources</text>
    <text class="detail" x="58" y="210">Deduplicate chunk IDs</text>
    <text class="detail" x="58" y="235">Use at most 5 sources</text>
    <text class="detail" x="58" y="260">Context cap: 6,000 chars</text>
  </g>
  <g><rect x="400" y="144" width="280" height="132" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="418" y="180">Generate once</text>
    <text class="detail" x="418" y="210" style="font-size:17px">Ollama · llama3.2:3b</text>
    <text class="detail" x="418" y="235" style="font-size:17px">Numbered-source prompt</text>
    <text class="detail" x="418" y="260" style="font-size:17px">Type hint shapes format</text>
  </g>
  <g><rect x="744" y="144" width="336" height="132" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="762" y="180">Check citations</text>
    <text class="detail" x="762" y="210">Keep valid [n] indices</text>
    <text class="detail" x="762" y="235">Remove out-of-range [n]</text>
    <text class="detail" x="762" y="260">Warn if citations missing</text>
  </g>
  <path class="flow" d="M336 210 H394"/>
  <polygon points="394,210 385,214 385,206" fill="#60758c"/>
  <path class="flow" d="M680 210 H738"/>
  <polygon points="738,210 729,214 729,206" fill="#60758c"/>
  <path class="flow" d="M912 276 V328 H848 V356"/>
  <polygon points="848,356 844,347 852,347" fill="#60758c"/>
  <text class="subtitle" x="40" y="326">NLI is optional and off by default.</text>
  <polygon points="848,356 1048,432 848,508 648,432" fill="#fff8ed" stroke="#dec39e" stroke-width="1.5"/>
  <text x="848" y="438" text-anchor="middle" style="font-size:19px;font-weight:700">NLI enabled?</text>
  <path class="flow" d="M648 432 H526"/>
  <polygon points="526,432 535,428 535,436" fill="#60758c"/>
  <text class="edge-label" x="582" y="414">Yes</text>
  <g><rect x="40" y="366" width="480" height="132" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="58" y="402">Score sentence grounding</text>
    <text class="detail" x="58" y="432">Every sentence × every source</text>
    <text class="detail" x="58" y="457">Best entailment ≥0.5 → grounded</text>
    <text class="detail" x="58" y="482">Report fraction grounded + warnings</text>
  </g>
  <path class="flow" d="M848 508 V546"/>
  <polygon points="848,546 844,537 852,537" fill="#60758c"/>
  <text class="edge-label" x="866" y="536">No</text>
  <g><rect x="648" y="552" width="432" height="100" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="666" y="588">Use heuristic score</text>
    <text class="detail" x="666" y="618">Retrieval scores + citation coverage</text>
  </g>
  <path class="flow" d="M280 498 V704 H560"/>
  <path class="flow" d="M864 652 V704 H560"/>
  <circle cx="560" cy="704" r="4" fill="#60758c"/>
  <path class="flow" d="M560 704 V734"/>
  <polygon points="560,734 556,725 564,725" fill="#60758c"/>
  <g><rect x="352" y="740" width="416" height="132" rx="12" fill="#effaf6" stroke="#9fd6c3" stroke-width="1.5"/>
  <text class="heading" x="370" y="776">Return response</text>
    <text class="detail" x="370" y="806">Answer + source excerpts</text>
    <text class="detail" x="370" y="831">500-char preview + ellipsis</text>
    <text class="detail" x="370" y="856">Confidence + warnings + time</text>
  </g>
  <text class="detail" x="40" y="914">NLI reports support estimates. It does not rewrite the answer or trigger another generation.</text>
</svg>
