<text fill="#7C3AED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0em"><tspan x="48" y="53.0909">NEXUSRAG  /  PIPELINE</tspan></text>
<text fill="#0F172A" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="bold" letter-spacing="0em"><tspan x="48" y="108.091">Find passages. Answer with sources.</tspan></text>
<text fill="#334155" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="0em"><tspan x="48" y="146.409">Search uploaded research papers and generate answers with local Ollama.</tspan></text>
