<svg role="img" aria-labelledby="pipeline-title pipeline-description" width="1280" height="940" viewBox="0 0 1280 940" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="pipeline-title">NexusRAG: from papers to cited answers</title>
<desc id="pipeline-description">Upload papers, parse overlapping passages, and build dense and BM25 indexes. Each question retrieves up to eight passages through adaptive rank fusion and at most one feedback search. Ollama uses up to five sources; citation indices are checked and NLI is optional. Recorded SciFact and NFCorpus retrieval results compare dense search, hybrid RRF, and corrective PRF. Fusion can help or hurt; these benchmarks do not measure answer accuracy.</desc>
