<text fill="#334155" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="0em"><tspan x="264" y="593.818">One feedback search if needed</tspan></text>
<text fill="#5B21B6" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0em"><tspan x="264" y="621.818">&#x2264;50 candidates each &#x2192; &#x2264;8 passages</tspan></text>
