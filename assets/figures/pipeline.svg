<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="0em"><tspan x="1008" y="548.409">Check citation indices</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="0em"><tspan x="1008" y="584.409">Optional NLI &#xb7; off</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="0em"><tspan x="1008" y="619.045">Confidence &#xb7; warnings</tspan></text>
