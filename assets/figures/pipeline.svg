<svg role="img" aria-labelledby="pipeline-title pipeline-description" width="1280" height="1000" viewBox="0 0 1280 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="pipeline-title">NexusRAG pipeline: documents to answers with sources</title>
<desc id="pipeline-description">Upload PDF, DOCX, Markdown or text documents. Parse overlapping passages and index BGE-small vectors in LanceDB alongside an in-memory BM25 index. Each question combines dense and keyword rankings. If the best dense cosine score is below 0.55, run one feedback search and merge both passes. Select up to eight passages and use up to five numbered sources to generate once with local Ollama. Check citation indices, optionally score NLI grounding, and return the answer, sources, confidence and warnings. NLI is off by default. Valid citation numbers do not establish factual support.</desc>
<rect width="1280" height="1000" fill="#14191C"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="0em"><tspan x="48" y="66.1364">NEXUSRAG PIPELINE</tspan></text>
<path d="M48 90H1232" stroke="#A8B5BD" stroke-width="2"/>
<rect x="24" y="112" width="1232" height="816" rx="8" fill="#1B2327" stroke="#303B41" stroke-width="1.5"/>
