<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
  <title id="title">Documents to answers</title>
  <desc id="description">Two application stages. Parse and chunk files, embed passages, persist vectors in LanceDB and keep BM25 in memory. Prepare a question, retrieve with dense search and BM25, optionally search once more and fuse both passes, generate with Ollama, check citation indices and optional NLI grounding, then return the answer and sources.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; fill: #172b45; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52647a; }
      .lane { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; fill: #52647a; }
      .heading { font-size: 23px; font-weight: 700; }
      .detail { font-size: 18px; fill: #42566e; }
      .edge-label { font-size: 17px; fill: #52647a; }
      .flow { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
      .feedback-flow { fill: none; stroke: #ae691a; stroke-width: 2; stroke-linejoin: round; }
      .index-flow { fill: none; stroke: #2465ad; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1120" height="620" rx="18" fill="#fff"/>
  <text class="title" x="40" y="52">Documents to answers</text>
  <text class="subtitle" x="40" y="84">Prepare documents. Answer questions from the retrieved passages.</text>
  <text class="lane" x="40" y="128">01  PREPARE DOCUMENTS</text>
  <g><rect x="40" y="154" width="304" height="120" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="58" y="190">Parse files</text>
    <text class="detail" x="58" y="220">PDF · DOCX · Markdown · TXT</text>
    <text class="detail" x="58" y="245">Text + source metadata</text>
  </g>
  <g><rect x="408" y="154" width="304" height="120" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="426" y="190">Chunk + embed</text>
    <text class="detail" x="426" y="220">Sections + passage overlap</text>
    <text class="detail" x="426" y="245">BGE-small embeddings</text>
  </g>
  <g><rect x="776" y="154" width="304" height="120" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="794" y="190">Build indexes</text>
    <text class="detail" x="794" y="220">LanceDB · persisted vectors</text>
    <text class="detail" x="794" y="245">BM25 · in-memory keywords</text>
  </g>
  <path class="flow" d="M344 214 H402"/>
  <polygon points="402,214 393,218 393,210" fill="#60758c"/>
  <path class="flow" d="M712 214 H770"/>
  <polygon points="770,214 761,218 761,210" fill="#60758c"/>
  <path class="index-flow" d="M928 274 V320 H348 V388"/>
  <polygon points="348,388 344,379 352,379" fill="#2465ad"/>
  <text class="subtitle" x="570" y="309">Stored passages feed both searches</text>
  <text class="lane" x="40" y="370">02  ANSWER A QUESTION</text>
  <g><rect x="40" y="394" width="192" height="120" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="58" y="430">Question</text>
    <text class="detail" x="58" y="460">Type hints +</text>
    <text class="detail" x="58" y="485">fixed rewrites</text>
  </g>
  <path class="flow" d="M232 454 H246"/>
  <polygon points="246,454 237,458 237,450" fill="#60758c"/>
  <g><rect x="252" y="394" width="192" height="120" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="270" y="430">Retrieve</text>
    <text class="detail" x="270" y="460">Dense + BM25</text>
    <text class="detail" x="270" y="485">One retry at most</text>
  </g>
  <path class="flow" d="M444 454 H458"/>
  <polygon points="458,454 449,458 449,450" fill="#60758c"/>
  <g><rect x="464" y="394" width="192" height="120" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="482" y="430">Generate</text>
    <text class="detail" x="482" y="460">Ollama</text>
    <text class="detail" x="482" y="485">Up to 5 sources</text>
  </g>
  <path class="flow" d="M656 454 H670"/>
  <polygon points="670,454 661,458 661,450" fill="#60758c"/>
  <g><rect x="676" y="394" width="192" height="120" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="694" y="430">Check</text>
    <text class="detail" x="694" y="460">Citation indices</text>
    <text class="detail" x="694" y="485">Optional NLI</text>
  </g>
  <path class="flow" d="M868 454 H882"/>
  <polygon points="882,454 873,458 873,450" fill="#60758c"/>
  <g><rect x="888" y="394" width="192" height="120" rx="12" fill="#effaf6" stroke="#9fd6c3" stroke-width="1.5"/>
  <text class="heading" x="906" y="430">Return</text>
    <text class="detail" x="906" y="460">Answer + sources</text>
    <text class="detail" x="906" y="485">Score + warnings</text>
  </g>
  <text class="detail" x="40" y="562">Retrieval depth: 50 candidates per search → 8 passages → at most 5 prompt sources.</text>
  <text class="detail" x="40" y="594">NLI is off by default. Read the returned passages when checking an answer.</text>
</svg>
