<text fill="#475569" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="0em"><tspan x="48" y="922.955">One benchmark document = one passage &#xb7; exact NumPy CPU search &#xb7; no reranker &#xb7; see evaluation protocol</tspan></text>
