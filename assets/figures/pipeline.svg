<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="368" y="505.727">Retrieve passages</tspan></text>
<text fill="#55C4E0" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="368" y="550.136">Dense + BM25</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="368" y="584.136">Adaptive rank fusion</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="368" y="621.273">&#x2264;50 candidates each</tspan></text>
<rect x="680" y="462" width="248" height="192" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0em"><tspan x="704" y="503.5">Generate answer</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="704" y="550.136">Ollama</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="IBM Plex Mono, Courier New, monospace" font-size="20" letter-spacing="0em"><tspan x="704" y="583.5">llama3.2:3b</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="0em"><tspan x="704" y="620.409">Numbered sources [1]</tspan></text>
