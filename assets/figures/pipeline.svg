<rect x="48" y="178" width="248" height="144" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="72" y="219.727">Documents</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="72" y="258.136">PDF &#xb7; DOCX&#10;</tspan><tspan x="72" y="287.136">Markdown &#xb7; text</tspan></text>
<rect x="344" y="178" width="280" height="144" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="368" y="219.727">Parse + split</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="368" y="258.136">Extract text into&#10;</tspan><tspan x="368" y="287.136">overlapping passages</tspan></text>
<rect x="680" y="178" width="552" height="144" rx="8" fill="#1B2327" stroke="#55C4E0" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="704" y="219.727">Index passages</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="704" y="258.136">BGE-small vectors &#x2192; LanceDB</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="21" letter-spacing="0em"><tspan x="704" y="292.136">BM25 keyword index &#xb7; in memory</tspan></text>
<path d="M298 250H336" stroke="#55C4E0" stroke-width="2"/>
<path d="M336 250L325 245V255L336 250Z" fill="#55C4E0"/>
<path d="M626 250H672" stroke="#55C4E0" stroke-width="2"/>
