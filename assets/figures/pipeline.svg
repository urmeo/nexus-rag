<text fill="#55C4E0" style="white-space: pre" xml:space="preserve" font-family="IBM Plex Mono, Courier New, monospace" font-size="18" letter-spacing="0em"><tspan x="704" y="352.25">reuse indexes</tspan></text>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0em"><tspan x="48" y="433.273">FOR EACH QUESTION</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="680" y="433.273">Select &#x2264;8 passages &#xb7; use &#x2264;5 sources</tspan></text>
