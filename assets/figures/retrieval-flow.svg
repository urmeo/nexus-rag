<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="48" y="937.273">Empty index &#x2192; ask for files. No matches &#x2192; return a no-results message. Both skip Ollama.</tspan></text>
