<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="368" y="731.273">&#x2264;10 frequent new terms&#10;</tspan><tspan x="368" y="759.273">from the first 5 passages&#10;</tspan><tspan x="368" y="787.273">Repeat dense + BM25&#10;</tspan><tspan x="368" y="815.273">and adaptive fusion once</tspan></text>
<rect x="816" y="650" width="416" height="192" rx="8" fill="#1B2327" stroke="#F08B79" stroke-width="2"/>
