<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="920" viewBox="0 0 1120 920" role="img" aria-labelledby="title description">
  <title id="title">Inside retrieval</title>
  <desc id="description">The default application searches dense vectors and BM25 at depth 50, then combines their rankings with adaptive weighted RRF. When first-pass results exist, correction is enabled and best dense cosine is below 0.55, it appends up to ten frequent new terms from the first five passages and repeats both searches once. Equal-weight RRF merges original and feedback rankings. It returns up to eight passages. Empty indexes and empty results return messages without calling Ollama.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; fill: #172b45; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52647a; }
      .lane { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; fill: #52647a; }
      .heading { font-size: 23px; font-weight: 700; }
      .detail { font-size: 18px; fill: #42566e; }
      .edge-label { font-size: 17px; fill: #52647a; }
      .flow { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
      .feedback-flow { fill: none; stroke: #ae691a; stroke-width: 2; stroke-linejoin: round; }
      .index-flow { fill: none; stroke: #2465ad; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1120" height="920" rx="18" fill="#fff"/>
  <text class="title" x="40" y="52">Inside retrieval</text>
  <text class="subtitle" x="40" y="84">Default settings · separate ranking inputs, adaptive fusion and one bounded feedback pass.</text>
  <g><rect x="40" y="156" width="208" height="148" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="58" y="192">Question</text>
    <text class="detail" x="58" y="222">Index check first</text>
    <text class="detail" x="58" y="247">Rule-based hints</text>
    <text class="detail" x="58" y="272">Fixed rewrites</text>
  </g>
  <g><rect x="312" y="136" width="284" height="104" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="330" y="172">Dense search</text>
    <text class="detail" x="330" y="202">Embed → LanceDB</text>
    <text class="detail" x="330" y="227">Up to 50 matches</text>
  </g>
  <g><rect x="312" y="264" width="284" height="104" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="330" y="300">BM25 search</text>
    <text class="detail" x="330" y="330">Keyword ranking</text>
    <text class="detail" x="330" y="355">Up to 50 matches</text>
  </g>
  <g><rect x="704" y="200" width="376" height="112" rx="12" fill="#f0f6ff" stroke="#a6c7ee" stroke-width="1.5"/>
  <text class="heading" x="722" y="236">Adaptive fusion</text>
    <text class="detail" x="722" y="266">Weighted RRF · k = 60</text>
    <text class="detail" x="722" y="291">Query-shape weight rules</text>
  </g>
  <path class="flow" d="M248 230 H280 V188 H306"/>
  <polygon points="306,188 297,192 297,184" fill="#60758c"/>
  <path class="flow" d="M280 230 V316 H306"/>
  <polygon points="306,316 297,320 297,312" fill="#60758c"/>
  <path class="flow" d="M596 188 H648 V256"/>
  <path class="flow" d="M596 316 H648 V256 H698"/>
  <polygon points="698,256 689,260 689,252" fill="#60758c"/>
  <path class="flow" d="M144 304 V334"/>
  <polygon points="144,334 140,325 148,325" fill="#60758c"/>
  <text class="edge-label" x="156" y="328">Index empty</text>
  <g><rect x="40" y="340" width="176" height="84" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="58" y="376">Ask for files</text>
    <text class="detail" x="58" y="406">No Ollama call</text>
  </g>
  <path class="flow" d="M892 312 V400 H244 V432"/>
  <polygon points="244,432 240,423 248,423" fill="#60758c"/>
  <polygon points="244,432 432,506 244,580 56,506" fill="#fff8ed" stroke="#dec39e" stroke-width="1.5"/>
  <text x="244" y="480" text-anchor="middle" style="font-size:19px;font-weight:700">Results + enabled</text>
  <text x="244" y="505" text-anchor="middle" style="font-size:19px;font-weight:700">Best dense score</text>
  <text x="244" y="530" text-anchor="middle" style="font-size:19px;font-weight:700">&lt; 0.55?</text>
  <text class="edge-label" x="441" y="490">Yes</text>
  <path class="feedback-flow" d="M432 506 H474"/>
  <polygon points="474,506 465,510 465,502" fill="#ae691a"/>
  <g><rect x="480" y="442" width="252" height="128" rx="12" fill="#fff8ed" stroke="#dec39e" stroke-width="1.5"/>
  <text class="heading" x="498" y="478">Feedback search</text>
    <text class="detail" x="498" y="508" style="font-size:17px">Add ≤10 new terms</text>
    <text class="detail" x="498" y="533" style="font-size:17px">from first 5 passages</text>
    <text class="detail" x="498" y="558" style="font-size:17px">Run both searches once</text>
  </g>
  <path class="feedback-flow" d="M732 506 H786"/>
  <polygon points="786,506 777,510 777,502" fill="#ae691a"/>
  <g><rect x="792" y="442" width="288" height="128" rx="12" fill="#fff8ed" stroke="#dec39e" stroke-width="1.5"/>
  <text class="heading" x="810" y="478">Fuse both passes</text>
    <text class="detail" x="810" y="508">First + feedback lists</text>
    <text class="detail" x="810" y="533">Equal-weight RRF</text>
    <text class="detail" x="810" y="558">k = 60</text>
  </g>
  <path class="flow" d="M1008 312 V416 H936 V436"/>
  <polygon points="936,436 932,427 940,427" fill="#60758c"/>
  <text class="edge-label" x="1020" y="378">First pass</text>
  <path class="flow" d="M244 580 V650 H560"/>
  <text class="edge-label" x="262" y="616">No retry</text>
  <path class="feedback-flow" d="M936 570 V650 H560"/>
  <circle cx="560" cy="650" r="4" fill="#60758c"/>
  <path class="flow" d="M560 650 V690"/>
  <polygon points="560,690 556,681 564,681" fill="#60758c"/>
  <g><rect x="352" y="696" width="416" height="112" rx="12" fill="#effaf6" stroke="#9fd6c3" stroke-width="1.5"/>
  <text class="heading" x="370" y="732">Keep up to 8 passages</text>
    <text class="detail" x="370" y="762">Select the final retrieval ranking</text>
    <text class="detail" x="370" y="787">Source selection happens next</text>
  </g>
  <path class="flow" d="M352 752 H286"/>
  <polygon points="286,752 295,748 295,756" fill="#60758c"/>
  <text class="edge-label" x="290" y="734">Empty</text>
  <g><rect x="40" y="710" width="240" height="112" rx="12" fill="#f7f9fc" stroke="#ccd6e2" stroke-width="1.5"/>
  <text class="heading" x="58" y="746">No matches</text>
    <text class="detail" x="58" y="776">No-results message</text>
    <text class="detail" x="58" y="801">No Ollama call</text>
  </g>
  <text class="detail" x="40" y="864">Next: build numbered sources, generate once and check the answer.</text>
  <text class="detail" x="40" y="894">The gate uses the best dense cosine score. It does not use the final answer confidence.</text>
</svg>
