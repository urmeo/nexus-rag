<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="840" y="731.273">Original + feedback rankings&#10;</tspan><tspan x="840" y="759.273">Equal-weight RRF &#xb7; k = 60</tspan></text>
