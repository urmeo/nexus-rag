<svg role="img" aria-labelledby="diagram-title diagram-description" width="1280" height="1000" viewBox="0 0 1280 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
<title id="diagram-title">NexusRAG retrieval: dense and keyword rankings</title>
<desc id="diagram-description">The default application checks the index and applies fixed query rules. Dense LanceDB search and BM25 each return up to 50 matches. Adaptive weighted reciprocal rank fusion combines the rankings with k=60 and fixed query-shape weights. If feedback is enabled, first-pass results exist, and the best raw dense cosine is below 0.55, add up to ten frequent non-query terms from the first five passages and repeat both searches and adaptive fusion once. Merge original and feedback rankings with equal-weight RRF, k=60, then select up to eight passages. The merged path bypasses the feedback gate. Empty indexes ask for files; no matches return a no-results message. Both skip Ollama.</desc>
<rect width="1280" height="1000" fill="#14191C"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="0em"><tspan x="48" y="66.1364">RETRIEVAL</tspan></text>
<path d="M48 90H1232" stroke="#A8B5BD" stroke-width="2"/>
<rect x="24" y="112" width="1232" height="780" rx="8" fill="#1B2327" stroke="#303B41" stroke-width="1.5"/>
<rect x="48" y="250" width="200" height="192" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="72" y="293.727">Question</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="72" y="337.273">Index check&#10;</tspan><tspan x="72" y="365.273">Pattern hints&#10;</tspan><tspan x="72" y="393.273">Fixed rewrites</tspan></text>
<rect x="312" y="162" width="260" height="144" rx="8" fill="#1B2327" stroke="#55C4E0" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="336" y="203.727">Dense search</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="336" y="241.273">Embed &#x2192; LanceDB&#10;</tspan><tspan x="336" y="269.273">&#x2264;50 matches</tspan></text>
<rect x="312" y="344" width="260" height="144" rx="8" fill="#1B2327" stroke="#55C4E0" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="336" y="385.727">BM25 search</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="336" y="423.273">Keyword ranking&#10;</tspan><tspan x="336" y="451.273">&#x2264;50 matches</tspan></text>
<rect x="636" y="250" width="280" height="192" rx="8" fill="#1B2327" stroke="#55C4E0" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0em"><tspan x="660" y="293.727">Combine rankings</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="660" y="337.273">Adaptive weighted RRF&#10;</tspan><tspan x="660" y="365.273">k = 60&#10;</tspan><tspan x="660" y="393.273">Query-shape weights</tspan></text>
<rect x="980" y="250" width="252" height="192" rx="8" fill="#1B2327" stroke="#CAD4D9" stroke-width="2"/>
<text fill="#E7EDED" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0em"><tspan x="1004" y="291.5">Keep &#x2264;8 passages</tspan></text>
<text fill="#A8B5BD" style="white-space: pre" xml:space="preserve" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="0em"><tspan x="1004" y="337.273">Final ranking&#10;</tspan><tspan x="1004" y="365.273">Build sources next</tspan></text>
