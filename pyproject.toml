[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scinexusrag"
description = "Local question answering over research documents with cited passages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "urme" }]
requires-python = ">=3.11.4"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dev = [
    "datasets>=5.0.1",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "aiohttp>=3.14.4",
    "multidict>=6.9.1",
    "pillow>=13.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.17",
    "mypy>=1.13.0",
]

[project.urls]
Repository = "https://github.com/urmeo/nexus-rag"

[tool.setuptools.dynamic]
version = { attr = "scinexusrag.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scinexusrag = ["web/**/*", "eval/data/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
files = ["src"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["scinexusrag"]
branch = true

[tool.coverage.report]
fail_under = 60
