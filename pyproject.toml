[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scinexusrag"
dynamic = ["version"]
description = "Local document search and cited answers with retrieval and evidence benchmarks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "urme"}
]
keywords = ["rag", "llm", "scientific-literature", "retrieval-augmented-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.13.0",
    "httpx>=0.28.0",
    "lancedb>=0.17.0",
    "pyarrow>=18.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.9",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.17",
    "mypy>=1.13.0",
    "PyYAML>=6.0.2",
]
eval = [
    "datasets>=3.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/urmeo/nexus-rag"
Repository = "https://github.com/urmeo/nexus-rag"

[project.scripts]
scinexusrag = "scinexusrag.cli:main"
scinexusrag-eval = "scinexusrag.eval.run:main"
scinexusrag-report = "scinexusrag.eval.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scinexusrag = ["py.typed", "web/*.html", "web/css/*.css", "web/js/*.js", "web/images/*.svg"]
"scinexusrag.eval" = ["data/*.json", "data/*/*.jsonl"]

[tool.setuptools.dynamic]
version = {attr = "scinexusrag.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]
"src/scinexusrag/api/routes.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["scinexusrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lancedb.*",
    "sentence_transformers.*",
    "pyarrow",
    "pyarrow.*",
    "rank_bm25",
    "rank_bm25.*",
    "datasets",
    "datasets.*",
    "matplotlib",
    "matplotlib.*",
    "transformers",
    "transformers.*",
    "scipy",
    "scipy.*",
    "slowapi",
    "slowapi.*",
    "magic",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/scinexusrag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
