target-version = "py311"
line-length = 100
src = ["src", "tests"]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008"]

[lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]
"src/scinexusrag/api/routes.py" = ["ARG001"]

[lint.isort]
known-first-party = ["scinexusrag"]
